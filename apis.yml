name: Cignara
description: Cignara is an enterprise AI platform that replaces traditional customer support
  (FAQ bots and IVR menus) with governed voice and chat AI agents that serve, sell, and grow.
  Its agents handle inbound and outbound phone and chat conversations end to end across 32+
  languages, pulling customer context, applying business policy, executing transactions
  (checkout, scheduling, refunds, retention), and offering a real-time human copilot for
  support teams. The platform emphasizes in-region data sovereignty and hallucination-free,
  policy-bound actions grounded in each enterprise's own knowledge base. Founded 2026
  (Y Combinator, Spring 2026) in San Francisco; legal entity ShopAdvisor Inc.
